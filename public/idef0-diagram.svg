<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background-color: #F8F5EE; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#4B5563" />
    </marker>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563" />
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 10 L 10 10 L 5 0 z" fill="#4B5563" />
    </marker>

    <!-- Filters & Gradients -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12" flood-color="#1E1B4B" />
    </filter>
    <filter id="pill-shadow" x="-5%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" flood-color="#000" />
    </filter>

    <linearGradient id="purple-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="50%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>
  </defs>

  <!-- Diagram Background Border -->
  <rect x="15" y="15" width="1170" height="720" rx="12" fill="#FAF7F2" stroke="#E2D9CC" stroke-width="2" />
  
  <!-- Diagram Header Bar -->
  <rect x="15" y="15" width="1170" height="42" rx="12" fill="#EFE8DB" />
  <rect x="15" y="45" width="1170" height="12" fill="#EFE8DB" />
  <line x1="15" y1="57" x2="1185" y2="57" stroke="#DDD3C4" stroke-width="1.5" />
  <text x="35" y="41" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="1.5" font-family="'Oswald', sans-serif">DIAGRAMA IDEF0 / NIVEL A-0 : SISTEMA INTEGRAL DE HARDWARE E INFRAESTRUCTURA</text>
  <text x="1155" y="41" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end" font-family="'Oswald', sans-serif">IATECH CO. • TIRADORES</text>

  <!-- ==================== CENTRAL RECTANGLE (PURPLE) ==================== -->
  <g filter="url(#card-shadow)">
    <!-- Main Box (center: X=430 to 770, width=340, Y=265 to 485, height=220) -->
    <rect x="420" y="260" width="360" height="230" rx="8" fill="url(#purple-card-grad)" stroke="#2E1065" stroke-width="2.5" />
    <!-- Inner Accent Line -->
    <rect x="426" y="266" width="348" height="218" rx="6" fill="none" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- Central Box Content -->
  <text x="600" y="302" font-size="11" font-weight="800" fill="#F3E8FF" text-anchor="middle" letter-spacing="2">PROCESO CENTRAL</text>
  <text x="600" y="328" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="'Oswald', sans-serif" letter-spacing="0.5">ÁREA DE HARDWARE E</text>
  <text x="600" y="350" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="'Oswald', sans-serif" letter-spacing="0.5">INFRAESTRUCTURA</text>
  
  <line x1="470" y1="365" x2="730" y2="365" stroke="#7E22CE" stroke-width="1.5" />

  <text x="600" y="390" font-size="13" font-weight="600" fill="#FDE047" text-anchor="middle" font-style="italic">Verbo de acción:</text>
  <text x="600" y="412" font-size="13" font-weight="500" fill="#E9D5FF" text-anchor="middle">Diseñar, desplegar y mantener la</text>
  <text x="600" y="430" font-size="13" font-weight="500" fill="#E9D5FF" text-anchor="middle">infraestructura física que garantiza la</text>
  <text x="600" y="448" font-size="13" font-weight="500" fill="#E9D5FF" text-anchor="middle">continuidad de los sistemas clínicos.</text>

  <!-- Node Code Box (A-0) -->
  <rect x="735" y="457" width="37" height="25" rx="3" fill="#3B0764" stroke="#9333EA" stroke-width="1" />
  <text x="753" y="474" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="'Oswald', sans-serif">A-0</text>


  <!-- ==================== 1. TOP ZONE: CONTROLES (C) ==================== -->
  <!-- Category Badge -->
  <g filter="url(#pill-shadow)">
    <rect x="525" y="70" width="150" height="28" rx="14" fill="#312E81" />
    <text x="600" y="88" font-size="12" font-weight="800" fill="#EEF2FF" text-anchor="middle" letter-spacing="1.5">CONTROLES (C)</text>
  </g>

  <!-- Control 1: Políticas de gobernanza -->
  <g filter="url(#pill-shadow)">
    <rect x="360" y="112" width="220" height="34" rx="6" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5" />
    <text x="470" y="133" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Políticas de gobernanza y seguridad</text>
  </g>
  <path d="M 470 146 L 470 252" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-down)" />

  <!-- Control 2: Normativas de salud -->
  <g filter="url(#pill-shadow)">
    <rect x="495" y="156" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5" />
    <text x="600" y="177" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Normativas de salud (ISO, CE, FDA)</text>
  </g>
  <path d="M 545 190 L 545 252" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-down)" />

  <!-- Control 3: Presupuesto OPEX/CAPEX -->
  <g filter="url(#pill-shadow)">
    <rect x="625" y="112" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5" />
    <text x="730" y="133" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Presupuesto OPEX / CAPEX</text>
  </g>
  <path d="M 655 146 L 655 252" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-down)" />

  <!-- Control 4: Estrategia y objetivos IATECH Co. -->
  <path d="M 725 146 L 725 252" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-down)" />
  <g filter="url(#pill-shadow)">
    <rect x="715" y="156" width="200" height="34" rx="6" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5" />
    <text x="815" y="177" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Estrategia y objetivos IATECH Co.</text>
  </g>
  <!-- Connector from Control 4 to line -->
  <path d="M 770 190 L 770 215 L 725 215" fill="none" stroke="#4B5563" stroke-width="2" />


  <!-- ==================== 2. LEFT ZONE: ENTRADAS (I) ==================== -->
  <!-- Category Badge -->
  <g filter="url(#pill-shadow)">
    <rect x="135" y="225" width="140" height="28" rx="14" fill="#C1522A" />
    <text x="205" y="243" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">ENTRADAS (I)</text>
  </g>

  <!-- Input 1: Requerimientos de infraestructura clínica -->
  <g filter="url(#pill-shadow)">
    <rect x="40" y="270" width="265" height="34" rx="6" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5" />
    <text x="172" y="291" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Requerimientos de infraest. clínica</text>
  </g>
  <path d="M 305 287 L 412 287" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-right)" />

  <!-- Input 2: Solicitudes de soporte técnico -->
  <g filter="url(#pill-shadow)">
    <rect x="40" y="325" width="265" height="34" rx="6" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5" />
    <text x="172" y="346" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Solicitudes de soporte técnico</text>
  </g>
  <path d="M 305 342 L 412 342" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-right)" />

  <!-- Input 3: Datos de inventario de equipos -->
  <g filter="url(#pill-shadow)">
    <rect x="40" y="380" width="265" height="34" rx="6" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5" />
    <text x="172" y="401" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Datos de inventario de equipos</text>
  </g>
  <path d="M 305 397 L 412 397" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-right)" />

  <!-- Input 4: Especificaciones de proveedores -->
  <g filter="url(#pill-shadow)">
    <rect x="40" y="435" width="265" height="34" rx="6" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5" />
    <text x="172" y="456" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Especificaciones de proveedores y HW</text>
  </g>
  <path d="M 305 452 L 412 452" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-right)" />


  <!-- ==================== 3. RIGHT ZONE: SALIDAS (O) ==================== -->
  <!-- Category Badge -->
  <g filter="url(#pill-shadow)">
    <rect x="925" y="225" width="140" height="28" rx="14" fill="#065F46" />
    <text x="995" y="243" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SALIDAS (O)</text>
  </g>

  <!-- Output 1: Alta disponibilidad 99.9% -->
  <path d="M 780 287 L 885 287" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-right)" />
  <g filter="url(#pill-shadow)">
    <rect x="895" y="270" width="265" height="34" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" />
    <text x="1027" y="291" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Infraestructura alta disponibilidad (99.9%)</text>
  </g>

  <!-- Output 2: Sistemas clínicos operativos -->
  <path d="M 780 342 L 885 342" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-right)" />
  <g filter="url(#pill-shadow)">
    <rect x="895" y="325" width="265" height="34" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" />
    <text x="1027" y="346" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Sistemas clínicos sin interrupciones</text>
  </g>

  <!-- Output 3: Reportes de mantenimiento y KPIs -->
  <path d="M 780 397 L 885 397" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-right)" />
  <g filter="url(#pill-shadow)">
    <rect x="895" y="380" width="265" height="34" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" />
    <text x="1027" y="401" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Reportes de mantenimiento y KPIs</text>
  </g>

  <!-- Output 4: Incidencias resueltas -->
  <path d="M 780 452 L 885 452" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-right)" />
  <g filter="url(#pill-shadow)">
    <rect x="895" y="435" width="265" height="34" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" />
    <text x="1027" y="456" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Incidencias resueltas (mesa de ayuda)</text>
  </g>


  <!-- ==================== 4. BOTTOM ZONE: MECANISMOS (M) ==================== -->
  <!-- Category Badge -->
  <g filter="url(#pill-shadow)">
    <rect x="525" y="682" width="150" height="28" rx="14" fill="#0F766E" />
    <text x="600" y="700" font-size="12" font-weight="800" fill="#CCFBF1" text-anchor="middle" letter-spacing="1.5">MECANISMOS (M)</text>
  </g>

  <!-- Mechanism 1: Equipo técnico Tiradores -->
  <path d="M 470 598 L 470 498" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-up)" />
  <g filter="url(#pill-shadow)">
    <rect x="365" y="600" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5" />
    <text x="470" y="621" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Equipo técnico (Tiradores)</text>
  </g>

  <!-- Mechanism 2: Infraestructura cloud e híbrida -->
  <path d="M 545 558 L 545 498" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-up)" />
  <g filter="url(#pill-shadow)">
    <rect x="440" y="555" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5" />
    <text x="545" y="576" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Infraestructura cloud e híbrida</text>
  </g>

  <!-- Mechanism 3: Smartsheet monitoreo -->
  <path d="M 655 558 L 655 498" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-up)" />
  <g filter="url(#pill-shadow)">
    <rect x="580" y="635" width="245" height="34" rx="6" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5" />
    <text x="702" y="656" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Herramientas de monitoreo (Smartsheet)</text>
  </g>
  <path d="M 702 635 L 702 580 L 655 580" fill="none" stroke="#4B5563" stroke-width="2" />

  <!-- Mechanism 4: Equipos y hardware físico -->
  <path d="M 730 598 L 730 498" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-up)" />
  <g filter="url(#pill-shadow)">
    <rect x="735" y="555" width="245" height="34" rx="6" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5" />
    <text x="857" y="576" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Equipos y HW físico (servidores, IoT)</text>
  </g>
  <path d="M 857 555 L 857 530 L 730 530" fill="none" stroke="#4B5563" stroke-width="2" />

</svg>
